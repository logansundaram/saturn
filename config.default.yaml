# Saturn runtime configuration.
#
# The model bindings, the filesystem paths, and the loop/safety knobs. Graph code never names a
# concrete model id — so swapping hardware is a one-line `active_tier` change here and never
# touches graph logic.

# Which hardware-tier preset (under `tiers:` below) is live. Change this one line to
# re-point Saturn at a different model.
active_tier: 4b

# ---------------------------------------------------------------------------
# Filesystem paths (relative to the repo root). Single source of truth.
# ---------------------------------------------------------------------------
paths:
  database: database
  documents: database/documents
  workspace: database/workspace         # fallback only: the working folder is where you launch saturn
  cache: database/cache                # persisted RAG vector store + corpus index
  memory: database/memory/memory.md   # persistent durable-facts store (remember/recall)
  db_sqlite: database/db.sqlite        # SqliteSaver checkpoints + trace
  sessions: database/sessions          # saved conversations (/resume save <name>, /resume <name>)
  snapshots: database/snapshots        # per-turn pre-write file snapshots (/undo)
  permissions: database/permissions.json  # persisted /policy risk overrides + allow prefixes
  exports: logging/exports             # /trace export run records (audit artifacts)

# ---------------------------------------------------------------------------
# Loop / safety runtime knobs.
# ---------------------------------------------------------------------------
runtime:
  # Agent passes per turn (one pass = one model call, which may issue several tool calls). From this pass on no tool call runs: a call is refused and the model answers from
  # what it has, saying what is undone.
  max_iterations: 16
  # Thinking — whether the model reasons before it answers. `/think` shows what each pass did
  # and sets the level; `/think <request>` runs one request at deep.
  #   fast   never think
  #   auto   think before acting: a pass that is about to call a tool is thought through
  #          first; a plain answer never waits on a thought. Also after an error or a steer.
  #   deep   think on every pass but the capped last one
  # (the old names off | adaptive | on still work.) A thought that comes back empty, runs past
  # think_budget, or is stopped with Esc is dropped and the pass answers without it.
  think: auto
  # The most tokens one thought may spend before it is cut (also the extra output room a
  # thinking pass gets, so the answer still fits after the thought).
  think_budget: 1024
  # Tools AT OR BELOW this risk tier run without prompting; anything riskier hits the
  # approval gate. One of: read_only | side_effecting | destructive.
  auto_approve: read_only
  # Ollama context window (`num_ctx`) for every local model. `null` = auto: each model uses its
  # `capabilities.<model>.context_window` below. An integer overrides every model at once (the
  # /config runtime.num_ctx command sets this live). Without it Ollama silently caps the window at 2048.
  num_ctx: null
  # Read timeout (seconds) for a single local-model call. Guards against a WEDGED Ollama daemon
  # (accepts the connection but never responds) hanging a turn forever — a turn that times out
  # fails cleanly and returns to the prompt. Set generously: it must exceed your slowest single
  # generation so a healthy-but-slow model is never false-tripped (connect is capped separately at
  # ~10s, so a daemon that is simply DOWN still fails fast). null disables the timeout.
  llm_timeout: 120
  # How long Ollama keeps the model loaded after each request (an Ollama duration: "30m", "2h";
  # -1 = never unload; null = the daemon's own 5-minute default). The daemon's default drops the
  # weights after five idle minutes, and the next turn then pays the whole load again (measured:
  # 37-50 s for a cold "hello" against 15 s warm). Sent on every request, so the
  # timer restarts each call; it is not a load option, so changing it never reloads the model.
  keep_alive: 30m
  # Idle prefix priming: between turns (and once after the weights load) the agent
  # re-sends the agent's stable prompt prefix — its system prompt plus the workspace grounding —
  # with one predicted token, so the daemon holds a prompt-cache checkpoint at the point the
  # next turn's call extends and it prefills only what is new (measured on the 9b: prefill
  # 5 s → 0.2 s per turn). Costs ~0.2 s of idle daemon time once warm;
  # a query typed mid-prime simply queues behind that one request. false = never prime.
  prime: true
  # Auto-compaction: when a turn leaves the context window filled past `compact_threshold` (a
  # fraction, 0–1), the older turns are folded into one LLM-written summary before the next turn so
  # the conversation stops re-sending — and overflowing — the window. The mechanical per-turn
  # compaction always runs; this is the heavier LLM summary.
  auto_compact: true
  compact_threshold: 0.85
  # Answer provenance: append a mechanical "Sources" footer listing the tool calls and
  # documents the answer drew on (completed reads and searches — not failed calls, not
  # writes). Each line's number is the handle for `/trace source <n>`. false restores
  # unadorned answers.
  citations: true
  # Air-gap: when true, every network egress Saturn makes is blocked and recorded — web tools
  # refuse, remote MCP calls refuse, and a remote Ollama refuses to run (the turn fails with an
  # actionable message). A shell command or a stdio MCP server is another process Saturn cannot
  # see inside, so under air-gap each one always asks you first (no allowlist, no open gate),
  # and a headless run refuses them.
  # Privacy made enforceable + verifiable, not just asserted. Toggle live with `/policy airgap
  # on|off`; `/policy airgap` (bare) proves the current posture. Every blocked attempt shows in
  # `/policy egress`.
  airgap: false
  # Prompt-injection quarantine (quarantine.py): UNTRUSTED tool output (web, remote
  # MCP, files, the shell, mail / notes / messages, the ingested corpus) is scanned for instruction-shaped content ("ignore your previous
  # instructions", tool-coercion, role overrides). A hit is flagged in the trace rail, fenced
  # between data-not-instructions markers before the model sees it, and shown at the approval
  # gate. One of:
  #   off    no scanning
  #   warn   scan + fence + show flags, but never change gating
  #   gate   warn, plus: the FIRST tool batch after a flagged observation faces the approval gate
  #          regardless of risk tier (one fresh human look at calls whose arguments may derive
  #          from injected content). The safe default.
  quarantine: gate
  # Trust receipt (receipt.py): append the trust segment to the one-line stats receipt under each
  # answer — `local-only` (or the turn's egress bytes/host summary), blocked attempts, and how
  # many calls faced the approval gate. Every answer proves the posture; false restores the plain
  # stats receipt.
  receipt: true
  # How long a gate `a` (always-allow) grant lives: task (dies at the end of the turn — the
  # default), session (dies when Saturn exits), persist (written to permissions.json). The
  # /policy allow COMMAND always persists. A trust setting: session-only unless --save.
  grant_scope: task

# ---------------------------------------------------------------------------
# Web tools (tools/web.py). API-less by design: web_search is keyless DuckDuckGo, web_extract
# is a local fetch + trafilatura extraction — no provider key, no account, ever. Unknown keys
# here are ignored.
# ---------------------------------------------------------------------------
web:
  max_results: 5            # results returned per web_search

# ---------------------------------------------------------------------------
# RAG pipeline (stores/rag.py + the search_knowledge_base tool). Escape-hatch tuning knobs —
# the defaults are sane for a local embedder; most users should never touch these.
#   chunk_size / chunk_overlap: characters per chunk fed to the embedder. Changing either
#     forces a full re-embed on the next sync/startup (the chunking is part of the cache
#     fingerprint, so the stored vectors always match the live settings).
#   k: chunks returned per search_knowledge_base call. Raise for better recall at the cost
#     of more context per retrieval; applies immediately (no re-embed).
# ---------------------------------------------------------------------------
rag:
  chunk_size: 1000
  chunk_overlap: 150
  k: 6

# ---------------------------------------------------------------------------
# Persistent memory (the layered store behind remember/recall, /memory, and the grounding
# block — stores/memory_registry.py).
# ---------------------------------------------------------------------------
memory:
  # Character budget for the memory block the grounding node loads every turn (user facts +
  # open commitments + the recent memo digest, then by-match facts, best match first). Facts
  # that don't fit are named in the block's trailer, never silently dropped.
  context_cap: 4000
  # A by-match fact (agent / entities / negative / older memo) that has not matched a request
  # in this many days is flagged stale in /memory — flagged, never auto-deleted.
  stale_days: 90
  # Whether /memory review (and /quit, when candidates are pending) asks the model to
  # propose facts from the session transcript on top of the mechanical candidates (steer
  # notes, gate denials, the compaction summary). Every
  # candidate still faces the review screen — nothing is written without your accept.
  review_llm: true
  # Auto-learn: a fact you state in your own words ("I'm vegetarian", "Petra is my manager",
  # "never book anything before 10am") is remembered WITHOUT asking — but only when its words
  # come from one sentence you typed and stated (not asked), and nothing from outside (a web
  # page, mail, a file, an attachment) has entered the conversation, in this turn or an earlier
  # one. Anything else still asks at the gate, which says why. The answer ends with a
  # `remembered #n` line; /memory remove <n> undoes it. false: every remember asks.
  # Headless runs (-p / -q) never auto-learn.
  auto_learn: true

# ---------------------------------------------------------------------------
# MCP servers (tools/mcp_client.py) — remote Model Context Protocol tools, registered at startup
# behind the SAME risk-tier approval gate as local tools. Check status with /mcp; apply config
# edits with /mcp reload (or restart).
#
#   connect_timeout: seconds to start + handshake the servers at startup (shared, they connect
#                    in parallel). A server that misses it is reported and skipped.
#   call_timeout:    seconds per remote tool call before it fails cleanly (mirrors shell.timeout).
#   servers:         name -> entry. Each entry:
#     transport: stdio | http | sse     (optional — inferred: command -> stdio, url -> http)
#     command/args/env                  (stdio: the server process to spawn)
#     url/headers                       (http/sse: the remote endpoint)
#     risk: read_only|side_effecting|destructive   default tier for the server's tools.
#           OMITTED or invalid -> destructive (always prompts). This is YOUR trust declaration —
#           the server's own annotations never drive the gate. Per-tool: /policy risk <tool> <tier> --save.
#     enabled: false                    (keep the entry, skip the connection)
#   ${VAR} in url/args/env/headers expands from the environment / .env, so secrets
#   never sit in this file. Tools register as `mcp_<server>_<tool>`.
#
# servers:
#   github:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-github"]
#     env:
#       GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
#   internal-docs:
#     url: https://mcp.example.com/mcp
#     headers:
#       Authorization: Bearer ${EXAMPLE_TOKEN}
#     risk: read_only
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Toolkits (/tools). A toolkit is a group of tools. `false` unbinds one: the model is
# not shown its tools and cannot call them, and Saturn says the toolkit is off when a
# request needs it. `/tools on|off <name>` edits these lines. The core (the checklist,
# questions, memory, the calculator and clock) is always on; an MCP server is turned
# on and off under `mcp:`.
# ---------------------------------------------------------------------------
toolkits:
  files: true           # read, write, edit, move, delete and search files
  web: true             # search the web, read a page
  shell: true           # run a shell command
  knowledge: true       # search your documents (the RAG corpus), add and remove them
  notes: true           # Apple Notes: search, read, create, append
  calendar: true        # Apple Calendar: list, create, update, delete events
  mail: true            # Apple Mail: list, search, read, draft, reply, file
  contacts: true        # Apple Contacts: look a person up
  reminders: true       # Apple Reminders: list, create, complete
  messages: true        # iMessage: find a group chat, read, send
  shortcuts: true       # Apple Shortcuts: list, run
  desktop: true         # the front browser tab, the Finder selection
  notifications: true   # schedule a one-off alert
  skills: true          # save a procedure as a skill

# --- scheduled notifications (notify/, the schedule_notification tool, /notify) -----------
notify:
  # Start the menu bar icon with each interactive launch (macOS). It is a separate small
  # process registered as a login LaunchAgent, so it outlives this terminal and comes back
  # after a reboot — like the notifications it lists. Its "Quit Saturn…" stops the agent,
  # cancels every pending notification, and removes itself. Off by default: true starts it
  # with every launch; /notify icon start brings it up once, on demand.
  menubar: false

mcp:
  connect_timeout: 20
  call_timeout: 60
  servers: {}

# ---------------------------------------------------------------------------
# Shell / code-execution tool (tools/shell.py).
#   run_shell is registered `destructive`, so it ALWAYS hits the approval gate — the gate (the
#   user seeing + approving the exact command), not a path jail, is the safety boundary.
#   timeout: seconds before a running command is killed, so a hung or interactive command can't
#            wedge the turn (mirrors runtime.llm_timeout). <=0 disables.
# ---------------------------------------------------------------------------
shell:
  timeout: 60
  # Environment-variable NAME fragments removed from a run_shell child's environment (substring,
  # case-insensitive) — a command can read a secret straight out of its own env. An empty list
  # disables (a trust setting: session-only unless --save).
  env_scrub: [API_KEY, SECRET, TOKEN, PASSWORD, CREDENTIAL, ANTHROPIC, OPENAI, AWS_, GITHUB_]

# ---------------------------------------------------------------------------
# Hardware-tier presets. Each binds ONE chat model (`model`: the agent's native tool-calling
# call per pass, and the background calls — history compaction, the memory review's proposals,
# /init's draft) and an `embedder`.
# ---------------------------------------------------------------------------
tiers:
  # One tier per parameter size, each binding the recommended qwen3.5-3.8 tag at that size
  # (core/model_family.py). The KEY is the size class, so a version bump (a future qwen3.9:27b)
  # is a one-line edit to the binding below and `active_tier` never churns. The ladder is a
  # recommendation, not a gate: any Ollama model with native tool-calling binds here (or via
  # `/models use <id>`); `/models` prices an off-ladder tag by the size in its name.
  # (A tier key must not contain a "." — config.get/set/persist parse dotted paths, and a "."
  # in a tier key silently splits it into two segments and corrupts the model bind.)
  #
  # The fresh-install default. Must stay in sync with the model list the install scripts pull
  # (install.sh SATURN_MODELS) — a fresh install sets this tier active, so a
  # mismatch breaks the first run.
  4b:
    model: "qwen3.5:4b"
    embedder: qwen3-embedding:8b

  9b:
    model: "qwen3.5:9b"
    embedder: qwen3-embedding:8b

  27b:
    model: "qwen3.8:27b"
    embedder: qwen3-embedding:8b

  35b:
    model: "qwen3.6:35b"
    embedder: qwen3-embedding:8b

# ---------------------------------------------------------------------------
# Capability descriptors, keyed by model id. The engine REQUIRES native tool-calling;
# check_models() warns if the bound model lacks it. Unknown models fall back to the
# conservative defaults in config.py (tools assumed, an 8192 window).
# ---------------------------------------------------------------------------
capabilities:
  # context_window is the RUNTIME window handed to ChatOllama (config.num_ctx_for). It is
  # deliberately NOT the architectural maximum: every qwen3.5-3.8 tag reports 262144, and
  # requesting that per call exhausts VRAM on any consumer card.
  #
  # The windows step up the ladder with the hardware each tier lands on. Every tag
  # is a hybrid (3 linear-attention layers per full-attention layer), so the KV cache is cheap:
  # 32 KB/token for 4b-9b, 64 KB/token for 27b, 20 KB/token for the 35b MoE. Priced so each tier
  # fits its home machine with ~1.5 GB headroom (/models shows the arithmetic):
  #   4b        32k   the 8 GB laptop / CPU-only end: 3.4 + 1.0 cache + headroom < 6 GB
  #   9b        64k   a 16 GB Mac (12 GB budget): 6.6 + 2.0 = ~10 GB
  #   27b       64k   a 32 GB Mac or a 24 GB card: 17 + 4.0 = ~22.5 GB (128k would need 26.5)
  #   35b      128k   36 GB+ unified memory: 23 + 2.5 = ~27 GB - the cache is so small that the
  #                   one big window on the ladder costs less than 27b's 64k does
  # Override every window with /config runtime.num_ctx; /models re-prices the fit table.
  "qwen3.5:4b":
    supports_tools: true
    context_window: 32768
  "qwen3.5:9b":
    supports_tools: true
    context_window: 65536
  "qwen3.8:27b":
    supports_tools: true
    context_window: 65536
  "qwen3.6:35b":
    supports_tools: true
    context_window: 131072
